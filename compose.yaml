# Local all-in-one demo stack.
# 1) docker compose up --build postgres migrate api frontend
# nginx serves the static build at http://localhost:5173; the browser calls the
# API directly at the base URL baked into the build (default
# http://localhost:8000, allowed by API CORS). Override at build time with
# VITE_ADAPTIVE_RAG_API_BASE_URL=... docker compose build frontend.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: adaptive_rag
      POSTGRES_USER: adaptive_rag
      POSTGRES_PASSWORD: adaptive_rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive_rag -d adaptive_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - adaptive_rag_pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env.example
    environment:
      ADAPTIVE_RAG_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
      ADAPTIVE_RAG_JOB_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
    command: ["uvicorn", "adaptive_rag.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    # Fail-closed startup prerequisite: uv run alembic upgrade head
    build: .
    env_file:
      - .env.example
    environment:
      ADAPTIVE_RAG_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time only: Vite bakes the API base into the static bundle.
        VITE_ADAPTIVE_RAG_API_BASE_URL: ${VITE_ADAPTIVE_RAG_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

  worker:
    build: .
    profiles:
      - worker
    env_file:
      - .env.example
    environment:
      ADAPTIVE_RAG_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
      ADAPTIVE_RAG_JOB_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
    command:
      - adaptive-rag
      - jobs
      - worker
      - --queues
      - ingestion,default,system
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Global in-app scheduler (provider model pricing daily, etc.).
  # Not host crontab: runs inside the product stack with DB-backed leases.
  scheduler:
    build: .
    env_file:
      - .env.example
    environment:
      ADAPTIVE_RAG_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
      ADAPTIVE_RAG_JOB_DATABASE_URL: postgresql+psycopg://adaptive_rag:adaptive_rag@postgres:5432/adaptive_rag
    command:
      - adaptive-rag
      - jobs
      - scheduler
      - --poll-interval-seconds
      - "30"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  adaptive_rag_pgdata:
